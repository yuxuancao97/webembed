<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b1a; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");
  let w, h, dpr;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr;
    h = c.height = innerHeight * dpr;
  }
  addEventListener("resize", size);
  size();

  const N = 420;
  const pts = Array.from({ length: N }, (_, i) => ({
    r: 0.12 + Math.random() * 0.36,
    a: Math.random() * Math.PI * 2,
    s: (0.15 + Math.random() * 0.5) * (i % 2 ? 1 : -1),
    hue: 230 + Math.random() * 90,
    z: 0.4 + Math.random() * 0.6,
  }));

  let last = performance.now();
  function frame(t) {
    const dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    ctx.fillStyle = "rgba(11, 11, 26, 0.18)";
    ctx.fillRect(0, 0, w, h);
    const m = Math.min(w, h);
    const cx = w / 2, cy = h / 2;
    for (const p of pts) {
      p.a += p.s * dt;
      const x = cx + Math.cos(p.a) * p.r * m * 1.25;
      const y = cy + Math.sin(p.a) * p.r * m * 0.55 * p.z;
      ctx.fillStyle = `hsla(${p.hue}, 90%, ${55 + p.z * 25}%, ${p.z})`;
      ctx.beginPath();
      ctx.arc(x, y, m * 0.0035 * p.z + dpr * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, m * 0.09);
    g.addColorStop(0, "rgba(255,240,200,0.95)");
    g.addColorStop(1, "rgba(255,160,80,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, m * 0.09, 0, Math.PI * 2); ctx.fill();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
